name: Build portable EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the EXE to
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.1 pillow

      - name: Run tests and compile check
        run: |
          python -m unittest -v test_installer test_detection_ui
          python -m py_compile app.py installer.py

      - name: Build EXE
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --icon "icon.png" --add-data "icon.png;." --name SnowRunnerManualInstaller app.py

      - name: Record checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/SnowRunnerManualInstaller.exe -Algorithm SHA256).Hash
          $size = (Get-Item dist/SnowRunnerManualInstaller.exe).Length
          "SHA256=$hash" | Tee-Object -FilePath checksum.txt -Append
          "SIZE=$size" | Tee-Object -FilePath checksum.txt -Append
          "SHA-256: $hash ($size bytes)" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnowRunnerManualInstaller
          path: dist/SnowRunnerManualInstaller.exe
          if-no-files-found: error

      - name: Attach EXE to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          gh release upload $tag dist/SnowRunnerManualInstaller.exe --clobber
